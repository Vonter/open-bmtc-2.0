openapi: 3.1.0
info:
  title: Namma BMTC 2.0 OpenAPI
  version: "1.0.0"
  summary: Unofficial API description for the Namma BMTC 2.0 (Chalo) Android app.
  description: |
    Unofficial reference for APIs and functionality used by Namma BMTC 2.0,
    covering service discovery, live tracking, trip planning, ticketing, passes,
    wallets, payments and ONDC mobility.

    ## Operation groups

    Operations in **Public**, **Other** and **Authentication** carry `security: []` and
    reach the server with no credentials. **Public** contains the primary transit APIs,
    followed by lower-priority public utilities in **Other** and the login flow in
    **Authentication**. **Authenticated** operations require the `userId` and
    `ACCESS_TOKEN` headers.

    ## Notes

    - A schema's `required` fields describe what the client expects to receive; the service
      may omit fields in error responses or in variants not yet seen in live traffic.
    - No per-vehicle attributes are exposed: a live vehicle carries only `vNo`, position,
      bearing, `eta` and halted state, and `/seat/availability` only a crowding level. The
      route's service class (`spf`; see `BmtcServiceClass`) is the sole vehicle-type signal
      and covers air-conditioning alone, so electric buses are indistinguishable from diesel.
    - Not affiliated with, endorsed by, or supported by BMTC or Chalo. For
      documentation and research purposes only.
  contact:
    name: Unofficial community documentation; not affiliated with BMTC or Chalo
servers:
  - url: https://production.zophop.com
    description: Primary production API host.
  - url: https://{env}.zophop.com
    description: Environment-templated host.
    variables:
      env: { default: production, enum: [production, dev, preprod] }
  - url: https://api.zophop.com
    description: Secondary API host.
  - url: https://geoquery.zophop.com
    description: Geo-query host; serves nearbybus/*.
  - url: https://cash.zophop.com
    description: Wallet and cash host.
  - url: https://chalo.com
    description: Chalo host; serves app/api/vasudha/*.
  - url: https://maps.googleapis.com/maps/api
    description: Google Maps host; serves geocode/json.
tags:
  - name: "Routes"
    description: "Find routes, route corridors and detailed route information."
  - name: "Stops"
    description: "Find stops and retrieve stop details, images and route stop lists."
  - name: "Trips"
    description: "Plan journeys and retrieve scheduled or nearby trip options."
  - name: "Live Tracking"
    description: |
      Real-time vehicle positions, ETAs and live-feed configuration.

      ### Using the live-tracking socket

      1. Call `GET /configuration/crts/live/v2/cities/{city}` with a URL-encoded
         `meta` JSON object. No token is required.
      2. Connect to `connection.baseUrl` with Socket.IO, using `connection.path` as
         the transport path, the default `/` namespace and Engine.IO 3.
      3. Emit `subscribe` for continuous updates or `once` for a snapshot. Send a
         JSON-string argument with `requestId` and a `ref`: `routes:<route_id>` for
         vehicle positions or `etas:<stop_id>:<route_id>` for arrivals.
      4. Listen for `message` events containing `ref`, `res` and optionally
         `requestId`. Maintain the Engine.IO heartbeat and disconnect to release
         subscriptions.
  - name: "Fares"
    description: "Pre-purchase fare, seat and trip-slot quotes."
  - name: "Search & Geocoding"
    description: "Place search, place details, forward and reverse geocoding."
  - name: "App Bootstrap Config"
    description: "Remote config, feature flags, content and the public product catalogue."
  - name: "Misc Public"
    description: "Emergency SOS, punch polling and payment status."
  - name: "Obtaining a token"
    description: |
      Use the public authentication endpoints below to obtain the credentials required by
      the authenticated API operations.

      1. Call `POST /chaukidar/v1/otp` with the mobile number and country code. Use
         `POST /chaukidar/v1/resend-otp` if another OTP is needed.
      2. Call `POST /chaukidar/v1/app/login` with `AuthType: SMS`, the OTP and the
         returned `refNo`.
      3. Save `accessToken`, `refreshToken` and `userProfile.userId` from the login
         response. Send the user ID in `userId` and the access token in `ACCESS_TOKEN`
         on authenticated operations.
      4. Exchange an expired token through `POST /chaukidar/v1/refreshTokens`. Use
         `POST /chaukidar/v1/logout` to invalidate the session.

      A valid token may not be sufficient to replay authenticated calls because the
      service may also require client-identification and request-signing headers.
  - name: "Mobile Ticketing & Passes"
    description: "Ticket and pass purchase, bookings, e-bill and NCMC card."
  - name: "Premium/Reserved Bus (TUB)"
    description: "Seat layouts and booking trip details."
  - name: "ONDC Mobility"
    description: "ONDC booking, ticketing and receipts."
  - name: "Wallet & Payments"
    description: "Chalo wallet, closed-loop wallet (cldw) and PPI operations."
  - name: "Payment Manager"
    description: "Payment provider orders, methods and UPI actions."
  - name: "User Profile"
    description: "Profile, saved places, saved rides and privacy agreements."
  - name: "Personalized Config"
    description: "Home screen, product catalogue and plans scoped to the user."
  - name: "File Upload"
    description: "Document and photo upload for pass applications."
x-tagGroups:
  - name: Public (no authentication)
    tags: ["Routes", "Stops", "Trips", "Live Tracking", "Fares"]
  - name: Other
    tags: ["Search & Geocoding", "App Bootstrap Config", "Misc Public"]
  - name: Authentication
    tags: ["Obtaining a token"]
  - name: Authenticated
    tags:
      [
        "Mobile Ticketing & Passes",
        "Premium/Reserved Bus (TUB)",
        "ONDC Mobility",
        "Wallet & Payments",
        "Payment Manager",
        "User Profile",
        "Personalized Config",
        "File Upload",
      ]
security:
  - accessToken: []
    userId: []
paths:
  # =========================== PUBLIC (no authentication) ===========================
  "/scheduler_v4/v4/{city}/autocomplete/route":
    parameters:
      - {
          name: city,
          in: path,
          required: true,
          schema: { type: string },
          example: bengaluru,
        }
    get:
      tags: ["Routes"]
      operationId: get_scheduler_v4_v4_city_autocomplete_route
      summary: "Search routes by name"
      security: []
      parameters:
        - name: day
          in: query
          required: true
          description: Day of week used to select the active route catalogue.
          schema: { type: string }
          example: Friday
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      {
                        type: array,
                        items:
                          { $ref: "#/components/schemas/RoutesDetailApiModel" },
                      },
                      { type: "null" },
                    ],
                }
              examples:
                liveCapture:
                  summary: Representative production response captured for Bengaluru on 11 September 2026
                  value:
                    [
                      {
                        special_features: [],
                        result_type: ROUTE,
                        route_id: mK2rtXc5,
                        agency_name: BMTC,
                        routePassEnabled: false,
                        route_name: "104",
                        spf: [Ordinary],
                        first_stop_name: Sadashivanagara,
                        isFreeRide: false,
                        match_ratio: 0,
                        last_stop_name: Kempegowda Bus Station(Majestic/KBS),
                        mTicketEnabled: true,
                        transport_type: bus,
                        direction_stop_name: Kempegowda Bus Station(Majestic/KBS),
                        station_type: bus,
                      },
                    ]
        default: { $ref: "#/components/responses/GenericError" }
  "/scheduler_v4/v1/{city}/routes/corridors":
    parameters:
      - {
          name: city,
          in: path,
          required: true,
          schema: { type: string },
          example: bengaluru,
        }
    get:
      tags: ["Routes"]
      operationId: get_scheduler_v4_v1_city_routes_corridors
      summary: "Route corridors near a point"
      description: |-
        Corridors (grouped route families) for one service type, ranked around a coordinate. Backs the
        premium-bus home surface.
      security: []
      parameters:
        - name: serviceType
          in: query
          required: true
          description: "Route service type to filter by; the app sends the enum name."
          schema: { type: string, enum: [PREMIUM] }
          example: PREMIUM
        - name: lat
          in: query
          required: false
          description: "Latitude to rank around, when a location is available."
          schema: { type: number }
          example: 12.91691
        - name: lon
          in: query
          required: false
          description: "Longitude to rank around, when a location is available."
          schema: { type: number }
          example: 77.62136
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      { $ref: "#/components/schemas/RoutesResponseApiModel" },
                      { type: "null" },
                    ],
                }
        "400":
          description: Premium corridors are not available in Bengaluru.
          content:
            text/plain:
              schema: { type: string }
              examples:
                liveCapture:
                  summary: Production response captured for Bengaluru on 11 September 2026
                  value: "Premium service not available for city: bengaluru"
        default: { $ref: "#/components/responses/GenericError" }
  "/scheduler_v4/v5/{city}/routesbetweenstops":
    parameters:
      - {
          name: city,
          in: path,
          required: true,
          schema: { type: string },
          example: bengaluru,
        }
    get:
      tags: ["Routes"]
      operationId: get_scheduler_v4_v5_city_routesbetweenstops
      summary: "Routes between two stops"
      description: |-
        Origin/destination route options between a stop pair, with fare-relevant flags.
      security: []
      parameters:
        - name: fromStopId
          in: query
          required: true
          description: "Origin stop ID."
          schema: { type: string }
          example: 6YPIHIgA
        - name: toStopId
          in: query
          required: true
          description: "Destination stop ID."
          schema: { type: string }
          example: dneIu5bn
        - name: mTicketEnabled
          in: query
          required: true
          description: "Sent as `true` by the app; restricts results to mobile-ticketable routes."
          schema: { type: boolean }
          example: true
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      {
                        type: array,
                        items:
                          {
                            $ref: "#/components/schemas/OriginDestinationApiModel",
                          },
                      },
                      { type: "null" },
                    ],
                }
              examples:
                liveCapture:
                  summary: Representative production response captured for Bengaluru on 11 September 2026
                  value:
                    [
                      {
                        specialFeatures: [],
                        fromStop:
                          {
                            name: Electronic City KIA,
                            lon: 77.66201,
                            id: 6YPIHIgA,
                            lat: 12.85049,
                          },
                        routeId: NsbPdEdi,
                        toStop:
                          {
                            name: Kempegowda International Airport,
                            lon: 77.70774,
                            id: dXF9lhdh,
                            lat: 13.19916,
                          },
                        spf: [Vayu Vajra],
                        lastStop:
                          {
                            name: Kempegowda International Airport,
                            lon: 77.70774,
                            id: dXF9lhdh,
                            lat: 13.19916,
                          },
                        serviceCategory: VVJ,
                        firstStop:
                          {
                            name: Electronic City Wipro Main Gate,
                            lon: 77.65742,
                            id: uPOlfcFT,
                            lat: 12.83594,
                          },
                        routeName: KIA-8E,
                      },
                    ]
        default: { $ref: "#/components/responses/GenericError" }
  "/ondc/buyer/v1/suggest/{cityId}/routes":
    parameters:
      - {
          name: cityId,
          in: path,
          required: true,
          schema: { type: string },
          example: bengaluru,
        }
    get:
      tags: ["Routes"]
      operationId: get_ondc_buyer_v1_suggest_cityId_routes
      summary: "Suggested ONDC routes"
      description: |-
        Route suggestions for a city and mode, with no origin/destination pinned.
      security: []
      parameters:
        - name: transitMode
          in: query
          required: true
          description: "Transit mode, upper-cased by the client."
          schema: { type: string }
          example: METRO
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      {
                        $ref: "#/components/schemas/OndcMetroRouteSearchResponseApiModel",
                      },
                      { type: "null" },
                    ],
                }
              examples:
                liveCapture:
                  summary: Production response captured for Bengaluru on 11 September 2026
                  value: { routes: [] }
        default: { $ref: "#/components/responses/GenericError" }
  "/ondc/buyer/v1/search/{cityId}/routes":
    parameters:
      - {
          name: cityId,
          in: path,
          required: true,
          schema: { type: string },
          example: bengaluru,
        }
    get:
      tags: ["Routes"]
      operationId: get_ondc_buyer_v1_search_cityId_routes
      summary: "ONDC routes between two stops"
      description: |-
        Route options for an ONDC origin/destination pair.
      security: []
      parameters:
        - name: fromStopId
          in: query
          required: true
          description: "Origin stop ID."
          schema: { type: string }
          example: qih5mR2N
        - name: toStopId
          in: query
          required: true
          description: "Destination stop ID."
          schema: { type: string }
          example: 4RS7uUdv
        - name: transitMode
          in: query
          required: true
          description: "Transit mode."
          schema:
            {
              type: string,
              enum: [BUS, RAILWAY, METRO, MONORAIL, FERRY, CAB, TRANSIT],
            }
          example: METRO
        - name: routeId
          in: query
          required: false
          description: "Pin the search to one route, when known."
          schema: { type: string }
          example: SHwjoGlU
        - name: appVer
          in: header
          required: true
          description: "Client version code required by the ONDC gateway."
          schema: { type: integer }
          example: 1340
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      {
                        $ref: "#/components/schemas/OndcRouteSearchResultApiModel",
                      },
                      { type: "null" },
                    ],
                }
        "500":
          description: No ONDC seller is currently available for this Bengaluru stop pair.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
              examples:
                liveCapture:
                  summary: Production response captured for Bengaluru on 11 September 2026
                  value:
                    {
                      error:
                        {
                          code: 1004,
                          message: No seller found for route/stop,
                          status: INTERNAL,
                          detail:
                            [
                              {
                                type: SERVER_ERROR,
                                reason: INTERNAL_SERVER_ERROR,
                                metaData:
                                  {
                                    url: /ondc/buyer/v1/search/bengaluru/routes,
                                  },
                              },
                            ],
                        },
                    }
        default: { $ref: "#/components/responses/GenericError" }
  "/scheduler_v4/v5/{city}/routedetails":
    parameters:
      - {
          name: city,
          in: path,
          required: true,
          schema: { type: string },
          example: bengaluru,
        }
    post:
      tags: ["Routes"]
      operationId: post_scheduler_v4_v5_city_routedetails
      summary: "Route details in bulk, versioned"
      description: |-
        Bulk route sync. The client sends `routeIdsToVersionMap` (route id -> cached version) and the server
        returns only routes whose version has moved on.
      security: []
      parameters:
        - name: isBackgroundSync
          in: query
          required: true
          description: "Whether this is a background sync rather than a user-initiated fetch."
          schema: { type: boolean }
          example: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/RoutesDataRequestDataApiModel" }
            examples:
              liveCapture:
                summary: Production request captured for Bengaluru on 11 September 2026
                value:
                  {
                    location: { lat: 12.91691, lng: 77.62136 },
                    meta:
                      {
                        androidModel: generic-client,
                        androidVersionCode: 1340,
                        city: bengaluru,
                        language: en,
                        osVersion: 35,
                        userId: "",
                      },
                    routeIdsToVersionMap: { WflFF29b: 0 },
                  }
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      {
                        $ref: "#/components/schemas/RoutesDataResponseApiModel",
                      },
                      { type: "null" },
                    ],
                }
              examples:
                liveCapture:
                  summary: Representative production response captured for Bengaluru on 11 September 2026
                  value:
                    {
                      routes:
                        [
                          {
                            routeId: WflFF29b,
                            staticData:
                              {
                                specialFeatures: [Vayu Vajra],
                                agency_name: BMTC,
                                route_name: KIA-8,
                                ttSid: 0,
                                stationType: BUS,
                              },
                            version: 0,
                            liveData:
                              {
                                routePassEnabled: false,
                                mTicketEnabled: true,
                                isFreeRide: false,
                                isAirportRoute: false,
                                isPremiumBusRoute: false,
                              },
                            status: UPDATED,
                          },
                        ],
                      version: 112,
                    }
        default: { $ref: "#/components/responses/GenericError" }
  "/scheduler_v4/v4/{city}/routedetails":
    parameters:
      - {
          name: city,
          in: path,
          required: true,
          schema: { type: string },
          example: bengaluru,
        }
    get:
      tags: ["Routes"]
      operationId: get_scheduler_v4_v4_city_routedetails
      summary: "Route details (legacy)"
      description: |-
        Single-route detail with its stop sequence, polyline and timetable. Superseded by the `v5` bulk
        endpoint, still used for one-off lookups.
      security: []
      parameters:
        - name: route_id
          in: query
          required: true
          description: "Route to fetch."
          schema: { type: string }
          example: WflFF29b
        - name: day
          in: query
          required: true
          description: "Day of week to evaluate the timetable for."
          schema: { type: string }
          example: Friday
        - name: meta
          in: query
          required: false
          description: "JSON-encoded client metadata blob."
          schema: { type: string }
          example: '{"city":"bengaluru","osVersion":35,"language":"en","androidModel":"generic-client","androidVersionCode":1340}'
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      {
                        $ref: "#/components/schemas/RouteDetailsResponseOldApiModel",
                      },
                      { type: "null" },
                    ],
                }
              examples:
                liveCapture:
                  summary: Representative production response captured for Bengaluru on 11 September 2026
                  value:
                    {
                      route:
                        {
                          route_id: WflFF29b,
                          routePassEnabled: false,
                          shortTripEnabled: false,
                          isFreeRide: false,
                          stopSequenceWithDetails:
                            [
                              {
                                stop_lon: 77.66201,
                                city: BENGALURU,
                                stop_id: 6YPIHIgA,
                                transport_type: bus,
                                stop_lat: 12.85049,
                                stateCode: KA,
                                short_id: 28419,
                                station_type: BUS,
                                stop_name: Electronic City KIA,
                              },
                            ],
                          agency_name: BMTC,
                          route_name: KIA-8,
                          spf: [Vayu Vajra],
                          transport_type: bus,
                          station_type: BUS,
                        },
                      timeTable:
                        [
                          {
                            start_time: 600,
                            isFrequency: false,
                            extrapolated: true,
                          },
                        ],
                    }
        default: { $ref: "#/components/responses/GenericError" }
  "/scheduler_v4/v4/{city}/routes/id":
    parameters:
      - {
          name: city,
          in: path,
          required: true,
          schema: { type: string },
          example: bengaluru,
        }
    get:
      tags: ["Routes"]
      operationId: get_scheduler_v4_v4_city_routes_id
      summary: "Whole-network route directory"
      description: |-
        Every route in the city for one transit mode, each with its stop sequence, polyline and
        service class. One call returns the whole network (9,058 direction entries and roughly 100 MB
        for Bengaluru buses), making it the cheapest way to read `spf` for every route and far too
        heavy to poll. Directions are separate entries sharing a `route_name`, and about 1% of names
        carry a different `spf` per direction, usually `Ordinary` against `Ordinary Express`.
      security: []
      parameters:
        - name: mode
          in: query
          required: true
          description: "Transit mode to list."
          schema: { type: string }
          example: bus
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      {
                        type: array,
                        items:
                          {
                            $ref: "#/components/schemas/RouteDirectoryEntryApiModel",
                          },
                      },
                      { type: "null" },
                    ],
                }
              examples:
                liveCapture:
                  summary: Representative production response captured for Bengaluru on 19 September 2026
                  value:
                    [
                      {
                        direction: UP,
                        route_id: 5Fl6gfg4,
                        reverse_routeId: "",
                        transport_type: bus,
                        station_type: BUS,
                        route_name: "305",
                        agency_name: BMTC,
                        internalName: KMT-NDV,
                        spf: [Ordinary],
                        owners: [app, etim],
                        totalDistance: 27931,
                        tt_type: 1,
                        ttStatus: 0,
                        ttSid: 0,
                        ticketingAllowed: true,
                        mTicketEnabled: true,
                        isFreeRide: false,
                        routePassEnabled: false,
                        stopPassEnabled: false,
                        isPremiumBusRoute: false,
                        isAirportRoute: false,
                        shortTripEnabled: false,
                        stopSequenceWithDetails:
                          [
                            {
                              stop_id: Afqg410p,
                              stop_lat: 12.96437,
                              stop_lon: 77.57736,
                              stop_name: KR Market,
                              short_id: 27795,
                              transport_type: bus,
                              station_type: BUS,
                              city: BENGALURU,
                              stateCode: KA,
                            },
                          ],
                      },
                    ]
        default: { $ref: "#/components/responses/GenericError" }
  "/scheduler_v4/v4/{city}/nearby/stops":
    parameters:
      - {
          name: city,
          in: path,
          required: true,
          schema: { type: string },
          example: bengaluru,
        }
    get:
      tags: ["Stops"]
      operationId: get_scheduler_v4_v4_city_nearby_stops
      summary: "Stops near a point"
      description: |-
        Stops closest to a coordinate, each annotated with its `distance` in metres.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          description: "Latitude of the search point."
          schema: { type: number }
          example: 12.91691
        - name: lon
          in: query
          required: true
          description: "Longitude of the search point."
          schema: { type: number }
          example: 77.62136
        - name: transitMode
          in: query
          required: true
          description: "Transit mode to search within."
          schema:
            {
              type: string,
              enum: [bus, railway, metro, monorail, ferry, cab, transit],
            }
          example: bus
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      {
                        type: array,
                        items:
                          {
                            $ref: "#/components/schemas/NearbyStopsToLocationResponseApiModel",
                          },
                      },
                      { type: "null" },
                    ],
                }
              examples:
                liveCapture:
                  summary: Representative production response captured for Bengaluru on 11 September 2026
                  value:
                    [
                      {
                        stop_id: qih5mR2N,

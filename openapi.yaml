        `special_features`, and as a code by `serviceCategory`. `Vajra`, `Vayu Vajra`, `Vajra
        Vistara` and `Divya Darshana` are air-conditioned and the rest are not; `Vistara` names a
        livery, not a temperature. Each agency publishes its own vocabulary under

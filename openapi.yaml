  "/seat/availability":
    post:
      tags: ["Fares"]
      operationId: post_seat_availability
      summary: "Seat availability for vehicles"
      description: |-
        Crowding/occupancy level per vehicle for the supplied vehicle ids.

        Each `vehicle[].status` is a crowding level, not a seat count: `0` or `3`
        means seats available (low crowding), `1` or `4` means standing space only
        (medium crowding), and `2` or `5` means overcrowded / no seats (high
        crowding). The reason for the two code groups is unverified. Treat any
        other integer as unknown and show no indicator, and match results by
        `number` rather than array position.
      security: []
      parameters:
        - name: mode
          in: header
          required: true
          description: >-
            City-configured seat-occupancy API mode, sent as a decimal integer string and
            mirroring `mode` in the body. Not a transit-mode ordinal. This operation has no
            query parameters.
          schema: { type: string }
          example: "2"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/GetSeatAvailabilityRequestApiModel",
              }
            examples:
              liveCapture:
                summary: Production request captured for Bengaluru on 11 September 2026
                value:
                  {
                    deviceId: generic-client,
                    cityId: bengaluru,
                    maxDelay: 60,
                    mode: 2,
                    occupancyFactor: 100,
                    vehicle:
                      [
                        { number: KA51AJ8574 },
                        { number: KA51AJ8907 },
                        { number: KA57F3362 },
                        { number: KA57F0175 },
                        { number: KA57F6200 },
                      ],
                  }
      responses:
        "4XX": { $ref: "#/components/responses/GenericError" }
        "200":
          description: Success
          content:
            application/json:
              schema:
                {
                  oneOf:
                    [
                      {
                        $ref: "#/components/schemas/GetSeatAvailabilityResponseApiModel",
                      },
                      { type: "null" },
                    ],
                }
              examples:
                liveCapture:
                  summary: Production response captured for Bengaluru on 11 September 2026
                  value:
                    {
                      vehicle:
                        [
                          { number: KA57F3362, status: -1 },
                          { number: KA57F0175, status: -1 },

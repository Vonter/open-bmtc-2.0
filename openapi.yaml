          in: query
          required: true
          description: "The text the user typed."
          schema: { type: string }
          example: Silk Board
        - name: location
          in: query
          required: false
          description: 'Bias point, as JSON `{"lat":..,"lon":..}`.'
          schema: { type: string }
          example: '{"lat":12.91691,"lon":77.62136}'
        - name: meta
          in: query
          required: true
          description: "Client description, serialised to JSON: `userId`, `deviceId`, `language`, `androidVersionCode`."
          schema: { type: string }
          example: '{"city":"bengaluru","osVersion":35,"language":"en","androidModel":"generic-client","androidVersionCode":1340}'
        - name: searchFilter
          in: query
          required: false
          description: "Extra filter, sent only when non-empty."
          schema: { type: string }
        - name: day
          in: query
          required: false
          description: "Day of week, sent for the default (non-place) search flavour."
          schema: { type: string }
          example: Friday
        - name: station_type
          in: query
          required: false
          description: "Sent as `transit` for the default search flavour."
          schema: { type: string }
          example: transit
        - name: transitMode
          in: query
          required: false

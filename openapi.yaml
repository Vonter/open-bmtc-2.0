components:
  schemas:
    AllProductConfigsApiResponseModel:
      properties:
        displayProps:
          items:
            {
              $ref: "#/components/schemas/ProductConfigDisplayPropsApiResponseModel",
            }
          type: [array, "null"]
        documentProps:
          items:
            {
              $ref: "#/components/schemas/ProductConfigDocumentPropsApiResponseModel",
            }
          type: [array, "null"]
        products:
          items: {}
          type: [array, "null"]
      required: [products, displayProps, documentProps]
      type: object
    AllWalletTransactionsResponseApiModel:
      properties:
        loadMoney:
          description: Also accepted as `onlineLoadTxns`.
          items: { $ref: "#/components/schemas/LoadMoneyResponseApiModel" }
          type: [array, "null"]
        onlineSpentMoney:
          description: Also accepted as `onlineSpentTxns`.
          items: { $ref: "#/components/schemas/ChaloPayApiModel" }
          type: [array, "null"]
        quickPay:
          description: Also accepted as `offlineSpentTxns`.
          items: { $ref: "#/components/schemas/QuickPayResponseApiModel" }
          type: [array, "null"]
      required: [quickPay, loadMoney, onlineSpentMoney]
      type: object
    AllWalletsSyncResponseApiModel:
      properties:
        status:
          type: [string, "null"]
        wallets:
          description: Also accepted as `closed_loop_digital_wallets`.
          items: { $ref: "#/components/schemas/WalletMetaResponseApiModel" }
          type: [array, "null"]
      required: [status, wallets]
      type: object
    ApiRequestEmptyObject: { type: object }
    ApplicableRuleApiResponseModel:
      properties:
        categoryName:
          type: [string, "null"]
        expiryAt:
          type: [integer, "null"]
        multiSeatAllowed:
          type: [boolean, "null"]
        priceOperator:
          type: [string, "null"]
        priceOperatorValue:
          type: [number, "null"]
        ridesRemaining:
          type: [integer, "null"]
        ruleId:
          type: [string, "null"]
        ruleName:
          type: [string, "null"]
        uxCopy:
          items:
            {
              $ref: "#/components/schemas/ApplicableRuleUxCopyApiResponseModel",
            }
          type: [array, "null"]
      required:
        [
          ruleId,
          ruleName,
          categoryName,
          priceOperator,
          priceOperatorValue,
          uxCopy,
          multiSeatAllowed,
          ridesRemaining,
          expiryAt,
        ]
      type: object
    ApplicableRuleUxCopyApiResponseModel:
      properties:
        copy:
          type: [string, "null"]
        couponName:
          type: [string, "null"]
        couponOfferCopy:
          type: [string, "null"]
        location:
          type: [string, "null"]
        termsAndConditions:
          items: { type: string }
          type: [array, "null"]
      required:
        [location, copy, couponName, couponOfferCopy, termsAndConditions]
      type: object
    AutoCompleteResultApiResponseModel:
      properties:
        data:
          oneOf:
            - {
                $ref: "#/components/schemas/SearchedResultItemsApiResponseModel",
              }
            - { type: "null" }
      type: object
    AutoLinkDeviceIdRequestApiModel:
      properties:

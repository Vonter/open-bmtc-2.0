        - name: to_lon
          in: query
          required: true
          description: "Destination longitude."
          schema: { type: number }
          example: 77.70215
        - name: mode
          in: query
          required: true
          description: "Transit mode; `trainish` covers metro plus rail."
          schema: { type: string }
          example: transit
        - name: start_time
          in: query
          required: true
          description: "Departure time, epoch seconds."
          schema: { type: integer }
          example: 1789098675
        - name: day
          in: query
          required: true
          description: "Day of week to evaluate timetables for."
          schema: { type: string }
          example: Friday
